stages:
  - install
  - test
  - build
  - deploy   # activate later (Sprint 8)

variables:
  NODE_ENV: test
  # Cache node_modules between jobs to speed things up
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - frontend/node_modules
    - backend/node_modules

# 1. Install dependencies
install_dependencies:
  stage: install
  image: node:20
  script:
    - cd backend && npm ci
    - cd ../frontend && npm ci
  artifacts:
    paths:
      - backend/node_modules
      - frontend/node_modules
    expire_in: 1h

# 2. Run tests (backend + frontend)
test_backend:
  stage: test
  image: node:20
  services:
    - name: mongo:6
      alias: mongo
  variables:
    MONGO_URL: "mongodb://mongo:27017/testdb"
  script:
    - cd backend
    - npm run lint
    - npm test
  needs: ["install_dependencies"]

test_frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm run lint
    - npm test -- --watchAll=false
  needs: ["install_dependencies"]

# 3. Build frontend (React)
build_frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/build
  needs: ["test_frontend"]

# 4. Deploy (placeholder, fill in Sprint 8)
deploy_production:
  stage: deploy
  image: node:20
  script:
    - echo "Deploy step goes here (e.g. AWS S3, Docker push, etc.)"
  when: manual
  only:
    - main
  needs: ["build_frontend", "test_backend"]
